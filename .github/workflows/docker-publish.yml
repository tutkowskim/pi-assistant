name: Test, Build, and Publish Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.13"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test backend
        working-directory: backend
        run: |
          uv sync --frozen --all-groups
          uv run ruff check app tests
          uv run pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Set release tag
        id: vars
        run: echo "tag=$(date -u '+%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

  publish:
    needs: [test, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            image: tutkowskim/pi-assistant-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: frontend
            image: tutkowskim/pi-assistant-frontend
            context: .
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ matrix.image }}:latest

  notify-homelab:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Update pinned HomeLab tags
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          jq -n \
            --arg event_type "update-docker-tags" \
            --arg tag "$RELEASE_TAG" \
            '{event_type: $event_type, client_payload: {tag: $tag, images: ["tutkowskim/pi-assistant-backend", "tutkowskim/pi-assistant-frontend"]}}' \
          | curl --fail-with-body -X POST https://api.github.com/repos/tutkowskim/HomeLab/dispatches \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @-
