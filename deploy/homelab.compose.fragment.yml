services:
  chat_backend:
    image: tutkowskim/chat-backend:RELEASE_TAG
    container_name: ChatBackend
    environment:
      - OPENAI_API_KEY=${CHAT_OPENAI_API_KEY}
      - GEMINI_API_KEY=${CHAT_GEMINI_API_KEY}
      - GEMINI_BASE_URL=${CHAT_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - OLLAMA_BASE_URL=${CHAT_OLLAMA_BASE_URL:-http://olamma.tutkowski.com/v1/}
      - APP_DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/chat.db
      - APP_TIMEZONE=${CHAT_TIMEZONE:-America/Los_Angeles}
      - MODEL_DISCOVERY_ENABLED=true
      - MODEL_REFRESH_SECONDS=${CHAT_MODEL_REFRESH_SECONDS:-15}
      - MCP_SERVERS=${CHAT_MCP_SERVERS:-[]}
      - DEFAULT_MODEL_ID=${CHAT_DEFAULT_MODEL_ID:-}
    volumes:
      - chat_data:/app/data
    restart: unless-stopped

  chat_frontend:
    image: tutkowskim/chat-frontend:RELEASE_TAG
    container_name: ChatFrontend
    depends_on:
      chat_backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chat_data:

